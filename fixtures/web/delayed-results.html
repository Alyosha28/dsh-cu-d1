<!doctype html><html><head><meta charset="utf-8"><title>Delayed results</title><style>[hidden]{display:none}</style></head><body><h1>Results</h1><button id="load" type="button">Load results</button><div id="status" role="status" hidden>Loading results</div><div id="done" hidden>Delayed results are ready</div><script>document.getElementById('load').addEventListener('click',()=>{const status=document.getElementById('status');const done=document.getElementById('done');status.hidden=false;done.hidden=true;setTimeout(()=>{status.hidden=true;done.hidden=false},800)})</script></body></html>
