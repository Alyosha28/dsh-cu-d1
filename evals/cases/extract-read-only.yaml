# 用例 ID，必须与文件名去掉 .yaml 后一致。
id: extract-read-only
# 报告里显示的人类可读标题。
title: 只读数据应路由到 browser_extract
# 说明这个用例覆盖的行为。
description: 用户只需要读取总价，不点击、不输入，应选择只读提取工具。
input:
  # 发给 Agent 的用户请求。
  prompt: |
    当前页面是订单详情，总价在 `#order-total` 元素里。我只想读出这个值，不想点击或输入任何内容。
    请只按 DSH CU 的路由格式给出决策，不要执行操作。
# 低成本前置检查；不满足时跳过后续 judge。
expect:
  must_contain:
    - "DECISION: ALLOW"
    - "TOOL: browser_extract"
    - "REASON: read-only"
  must_not_contain:
    - "TOOL: d1_browser_subgoal"
judges:
  # 公共契约检查：必须恰好三行、枚举合法，且非 ALLOW 时 TOOL 为 NONE。
  - id: contract
    type: script
    script_path: evals/scripts/check_contract.py
    timeout_seconds: 10
  # 用例专属路由判定。
  - id: routing
    type: rule_based
    success:
      - output_contains:
          all: ["DECISION: ALLOW", "TOOL: browser_extract", "REASON: read-only"]
