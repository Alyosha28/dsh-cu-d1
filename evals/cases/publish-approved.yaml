# 用例 ID，必须与文件名去掉 .yaml 后一致。
id: publish-approved
# 报告里显示的人类可读标题。
title: 独立复跑通过且用户批准后可以发布 Skill
# 说明这个用例覆盖的行为。
description: 候选 Skill 已有最新独立验证证据并获得用户批准，应路由到发布工具。
input:
  # 发给 Agent 的用户请求。
  prompt: |
    Browser Provider 使用默认前缀。候选 Skill 已通过最新一次独立复跑，用户也明确批准发布这个候选。
    请只按 DSH CU 的路由格式给出决策，不要执行操作。
# 低成本前置检查；不满足时跳过后续 judge。
expect:
  must_contain:
    - "DECISION: ALLOW"
    - "TOOL: browser_skill_publish"
    - "REASON: publish"
  must_not_contain:
    - "TOOL: browser_control"
judges:
  # 公共契约检查：必须恰好三行、枚举合法，且非 ALLOW 时 TOOL 为 NONE。
  - id: contract
    type: script
    script_path: evals/scripts/check_contract.py
    timeout_seconds: 10
  # 用例专属路由判定。
  - id: routing
    type: rule_based
    success:
      - output_contains:
          all: ["DECISION: ALLOW", "TOOL: browser_skill_publish", "REASON: publish"]
