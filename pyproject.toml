[project]
name = "dsh-cu-decision-lab"
version = "0.1.0"
description = "Offline decision-model experiments for DSH browser and computer use"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.30",
  "pillow>=11",
  "playwright>=1.50",
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=5.19,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
